{# Site Navigation — sticky header, responsive with mobile hamburger #}
{%- set cp = current_path | default(value="/") -%}

<header class="site-header" id="site-header">
  <nav class="nav" aria-label="Main navigation">
    <a class="nav-logo" href="/" aria-label="{{ config.extra.brand_name }} — Home">
      <img src="/images/logo.avif" alt="{{ config.extra.brand_name }}" class="nav-logo-img">
    </a>

    {#- Desktop links -#}
    <div class="nav-links" id="nav-links">
      <a href="/"
         class="nav-link{% if cp == '/' %} nav-link-active{% endif %}">Home</a>

      <a href="/about"
         class="nav-link{% if cp is starting_with('/about') %} nav-link-active{% endif %}">About</a>

      <a href="/services/public-sector"
         class="nav-link{% if cp is starting_with('/services/public-sector') %} nav-link-active{% endif %}">Public Sector</a>

      <a href="/services/private-sector"
         class="nav-link{% if cp is starting_with('/services/private-sector') %} nav-link-active{% endif %}">Private Sector</a>

      <a href="/programs"
         class="nav-link{% if cp is starting_with('/programs') %} nav-link-active{% endif %}">Programs</a>

      <a href="/contact"
         class="nav-link{% if cp is starting_with('/contact') %} nav-link-active{% endif %}">Contact</a>

      <span class="nav-cta">
        <a href="{{ config.extra.calendly_free_consultation }}"
           class="btn btn-primary btn-sm"
           target="_blank"
           rel="noopener noreferrer">Book Now <span class="btn-arrow" aria-hidden="true">&rarr;</span></a>
      </span>
    </div>

    {#- Mobile hamburger -#}
    <button class="nav-hamburger" id="nav-toggle"
            aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-links">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
</header>
