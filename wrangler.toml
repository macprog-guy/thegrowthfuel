name = "thegrowthfuel"
main = "workers/src/index.js"
compatibility_date = "2025-03-17"

[[routes]]
pattern = "rethinkperformance.ch/*"
custom_domain = true

[[routes]]
pattern = "www.rethinkperformance.ch/*"
custom_domain = true

[assets]
directory = "./public"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1